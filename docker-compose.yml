services:
  postgres :
    image: postgres:16
    container_name: nonj-postgres
    environment:
      POSTGRES_USER : admin
      POSTGRES_PASSWORD : admin123
      POSTGRES_DB : nonj_db
    ports :
      - '5432:5432'
    volumes:
      - nonj-pgdata:/var/lib/postgresql/data

volumes:
  nonj-pgdata :